<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reading Speed Analyzer</title>
  <style>
    body {
      background:#0f0f1a;
      font-family: Arial, sans-serif;
      color:white;
      margin:0;
      padding:20px;
    }
    h1 { margin-bottom:20px; }
    .section {
      background:#1a1a2e;
      padding:20px;
      border-radius:12px;
      margin-bottom:25px;
    }
    input, button {
      padding:12px;
      border-radius:8px;
      border:none;
      margin-top:8px;
      width:100%;
      box-sizing:border-box;
    }
    button {
      background:#6c47ff;
      color:white;
      cursor:pointer;
      font-size:16px;
      margin-top:20px;
    }
    button:hover {
      background:#8369ff;
    }
    #errorBox {
      background:#ff4d4d;
      padding:14px;
      border-radius:8px;
      margin-top:20px;
      display:none;
      font-size:15px;
    }
    #results {
      margin-top:20px;
      padding:18px;
      background:#16213e;
      border-radius:10px;
      display:none;
    }
  </style>
</head>

<body>

  <h1>Reading Speed Analyzer</h1>

  <!-- Reading Time -->
  <div class="section">
    <h2>1. Reading Time</h2>

    <label>Minutes</label>
    <input id="minutes" type="number" placeholder="e.g. 10">

    <label>Seconds</label>
    <input id="seconds" type="number" placeholder="e.g. 30">
  </div>

  <!-- Page Measurement -->
  <div class="section">
    <h2>2. Page Measurement</h2>

    <label>Upload page images (JPG/PNG)</label>
    <input id="imageInput" type="file" accept="image/*" multiple>

    <label>Total pages read (if exactly 1 sample page)</label>
    <input id="samplePages" type="number" placeholder="e.g. 5">

    <label>Manual page count (if no images)</label>
    <input id="manualPages" type="number" placeholder="e.g. 10">
  </div>

  <button onclick="calculate()">Calculate Reading Speed</button>

  <div id="results"></div>

  <div id="errorBox"></div>

<script>
async function calculate() {
  document.getElementById("errorBox").style.display = "none";
  document.getElementById("results").style.display = "none";

  const minutes = parseFloat(document.getElementById("minutes").value) || 0;
  const seconds = parseFloat(document.getElementById("seconds").value) || 0;
  const files = document.getElementById("imageInput").files;
  const sampleCount = parseInt(document.getElementById("samplePages").value);
  const manualCount = parseInt(document.getElementById("manualPages").value);

  const totalMinutes = minutes + seconds / 60;
  if (totalMinutes <= 0) return showError("Enter reading time!");

  let totalWords = 0;

  // CASE 1: User uploads images
  if (files.length > 0) {
    for (let i = 0; i < files.length; i++) {
      const base64 = await fileToBase64(files[i]);
      const wc = await callGemini(base64);
      if (wc === null) return; // error occurred
      totalWords += wc;
    }

    // sample mode: 1 sample page → multiply
    if (files.length === 1 && sampleCount > 0) {
      totalWords = totalWords * sampleCount;
    }
  }

  // CASE 2: No images → manual
  else if (!isNaN(manualCount) && manualCount > 0) {
    totalWords = manualCount * 300;
  }

  else {
    return showError("Please upload images or enter manual page count.");
  }

  const wpm = Math.round(totalWords / totalMinutes);

  document.getElementById("results").innerHTML = `
    <h3>Your Reading Speed</h3>
    <p><b>Total words:</b> ${totalWords.toLocaleString()}</p>
    <p><b>WPM:</b> ${wpm.toLocaleString()}</p>
  `;
  document.getElementById("results").style.display = "block";
}

function showError(msg) {
  const box = document.getElementById("errorBox");
  box.innerText = msg;
  box.style.display = "block";
}

function fileToBase64(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.readAsDataURL(file);
  });
}

async function callGemini(base64) {
  try {
    const res = await fetch("/api/gemini", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ base64Image: base64 }),
    });

    const json = await res.json();
    if (json.error) {
      showError("Gemini error: " + json.error);
      return null;
    }
    return json.wordCount;
  } catch (err) {
    showError("Server error: " + err.message);
    return null;
  }
}
</script>

</body>
</html>
